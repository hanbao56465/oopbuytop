name: Refresh catalog snapshot

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - env:
          MAISONLOOKS_API_KEY: ${{ secrets.MAISONLOOKS_API_KEY }}
          MAISONLOOKS_MAX_PER_CATEGORY: '200'
        run: node scripts/fetch-maisonlooks.mjs
      - run: |
          git diff --quiet -- src/data || {
            git config user.name "oopbuytop-bot"
            git config user.email "oopbuytop-bot@users.noreply.github.com"
            git add src/data
            git commit -m "chore: refresh catalog snapshot"
            git push
          }
